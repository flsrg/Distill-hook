[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "codex-distill-hook"
version = "0.1.0"
description = "Standalone reversible command-output distillation for Codex PreToolUse hooks"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "Distill Hook contributors"}]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
distill-hook = "distill_hook.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
